<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Prepare a diamond-mining trip</title><desc id="desc">Record your base coordinates, bring an iron pickaxe and supplies, follow a retraceable path, then return with your loot. Java uses F3; Bedrock uses Show Coordinates.</desc><rect width="960" height="540" rx="24" fill="#162c3c"/><g font-family="system-ui,sans-serif"><text x="48" y="59" fill="#b8cad8" font-size="18" letter-spacing="3">MINECRAFT / BEFORE YOU DIG</text><text x="48" y="116" fill="#f0f5f8" font-size="38" font-weight="700">A plan for getting back.</text><g fill="#233e50" stroke="#5e8294"><rect x="48" y="157" width="416" height="135" rx="18"/><rect x="496" y="157" width="416" height="135" rx="18"/><rect x="48" y="316" width="416" height="135" rx="18"/><rect x="496" y="316" width="416" height="135" rx="18"/></g><g fill="#a8e5dd" font-size="26" font-weight="700"><text x="74" y="201">01  Save your coordinates</text><text x="522" y="201">02  Pack the right tools</text><text x="74" y="360">03  Keep a return route</text><text x="522" y="360">04  Mine, then return</text></g><g fill="#e0e9f0" font-size="20"><text x="74" y="243">Java: F3 → XYZ</text><text x="74" y="272">Bedrock: Show Coordinates</text><text x="522" y="243">Iron pickaxe · food · torches</text><text x="522" y="272">Building blocks for a safe path</text><text x="74" y="402">Use steps you can retrace.</text><text x="74" y="431">Watch for lava and open drops.</text><text x="522" y="402">Collect ore with a suitable pickaxe.</text><text x="522" y="431">Leave before supplies run out.</text></g><text x="48" y="498" fill="#b8cad8" font-size="18">No fixed best Y-level or guaranteed deposit. Check your world version.</text></g></svg>