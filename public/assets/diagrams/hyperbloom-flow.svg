<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">How standard Hyperbloom forms</title><desc id="desc">Hydro plus Dendro creates a Dendro Core. Electro hitting that core triggers Hyperbloom. Assign a role to each owned character.</desc><rect width="960" height="540" rx="24" fill="#102d35"/><g font-family="system-ui,sans-serif"><text x="52" y="62" fill="#b9d8d5" font-size="18" letter-spacing="3">GAMEBREAK / REACTION FIELDNOTES</text><text x="52" y="119" fill="#f1f8ec" font-size="38" font-weight="700">Three elements. Clear roles.</text><g font-size="26" text-anchor="middle" font-weight="700"><rect x="52" y="183" width="170" height="104" rx="20" fill="#96daf4"/><text x="137" y="244" fill="#183c53">Hydro</text><text x="251" y="244" fill="#f1f8ec">+</text><rect x="280" y="183" width="170" height="104" rx="20" fill="#c6e590"/><text x="365" y="244" fill="#284a28">Dendro</text><text x="482" y="244" fill="#f1f8ec">→</text><rect x="520" y="183" width="380" height="104" rx="20" fill="#244d47" stroke="#c6e590" stroke-width="2"/><text x="710" y="229" fill="#e4f4cb">Dendro Core</text><text x="710" y="262" fill="#c6dfd9" font-size="17" font-weight="400">First, check that a core appeared.</text><rect x="52" y="327" width="398" height="98" rx="20" fill="#d4c2ed"/><text x="251" y="383" fill="#432e62">Electro hits the core</text><text x="482" y="383" fill="#f1f8ec">→</text><rect x="520" y="327" width="380" height="98" rx="20" fill="#ddedac"/><text x="710" y="383" fill="#284a28">Hyperbloom</text></g><text x="52" y="484" fill="#c6dfd9" font-size="18">Standard reaction reference · special talents may change the result.</text></g></svg>